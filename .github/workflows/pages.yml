name: Test & Sync GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Python backend & ICS tests
        run: QUIET_LOGS=1 python3 -m unittest discover -s tests -v

      - name: Run Node frontend & standalone serverless tests
        run: node tests/test_frontend_logic.mjs

      - name: Sync web/ directory to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SPLIT_SHA=$(git subtree split --prefix web HEAD)
          git push origin "$SPLIT_SHA:refs/heads/gh-pages" --force
